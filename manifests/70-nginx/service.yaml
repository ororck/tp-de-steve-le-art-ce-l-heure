apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: monitoring
  annotations:
    service.beta.kubernetes.io/azure-pip-name: steveleharceleur-pip
    service.beta.kubernetes.io/azure-load-balancer-resource-group: msaidiRG
    service.beta.kubernetes.io/azure-dns-label-name: steveleharceleur
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
