injector:
  enabled: false
ui:
  enabled: false
server:
  standalone:
    enabled: true
    config: |
      ui = false
      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }
      storage "file" {
        path = "/vault/data"
      }
  ha:
    enabled: false
  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: monitoring-premium-retain
    accessMode: ReadWriteOnce
  auditStorage:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
