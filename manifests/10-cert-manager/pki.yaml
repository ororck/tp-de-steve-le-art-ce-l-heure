apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: root-ca
  namespace: cert-manager
spec:
  isCA: true
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned-bootstrap
  secretName: root-ca-tls
  duration: 87600h
  commonName: root-ca
  privateKey:
    algorithm: ECDSA
    size: 256
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: root-ca-issuer
spec:
  ca:
    secretName: root-ca-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: intermediate-ca
  namespace: cert-manager
spec:
  isCA: true
  issuerRef:
    kind: ClusterIssuer
    name: root-ca-issuer
  secretName: intermediate-ca-tls
  duration: 43800h
  commonName: intermediate-ca
  privateKey:
    algorithm: ECDSA
    size: 256
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: intermediate-issuer
spec:
  ca:
    secretName: intermediate-ca-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: monitoring
spec:
  issuerRef:
    kind: ClusterIssuer
    name: intermediate-issuer
  dnsNames:
    - steveleharceleur.francecentral.cloudapp.azure.com
  secretName: grafana-tls
  duration: 2160h
  renewBefore: 360h
  usages:
    - server auth
