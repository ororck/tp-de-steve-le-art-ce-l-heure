apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: Prometheus
    uid: Prometheus
    type: prometheus
    access: proxy
    isDefault: true
    url: http://prometheus-operated.monitoring.svc:9090
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: Alertmanager
    uid: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager-operated.monitoring.svc:9093
    jsonData:
      implementation: prometheus
