apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tp-steve-pods
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: tp-steve
spec:
  groups:
    - name: pods
      rules:
        - alert: PodCrashLoopBackOff
          expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Pod en CrashLoopBackOff"
            description: "Le conteneur {{ $labels.container }} du pod {{ $labels.namespace }}/{{ $labels.pod }} est en CrashLoopBackOff."
        - alert: PodNotReady
          expr: kube_pod_status_ready{condition="false"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod non prêt depuis plus de 10 minutes"
            description: "Le pod {{ $labels.namespace }}/{{ $labels.pod }} n'est pas prêt depuis plus de 10 minutes."
        - alert: ContainerRestartingOften
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Redémarrages répétés d'un conteneur"
            description: "Le conteneur {{ $labels.container }} du pod {{ $labels.namespace }}/{{ $labels.pod }} a redémarré plus de 3 fois en 15 minutes."
        - alert: PodPending
          expr: kube_pod_status_phase{phase="Pending"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod en Pending depuis plus de 10 minutes"
            description: "Le pod {{ $labels.namespace }}/{{ $labels.pod }} est en Pending depuis plus de 10 minutes."
